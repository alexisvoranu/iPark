name: iPark EKS CI/CD Pipeline

on:
  push:
    branches: [ "develop", "master" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose deploy environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Artifact with Maven
        run: mvn clean package -DskipTests

      - name: Set Environment Variables
        id: env-setup
        run: |
          TARGET_ENV="${{ github.event.inputs.environment }}"
          if [ -z "$TARGET_ENV" ]; then
            if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
              TARGET_ENV="prod"
            else
              TARGET_ENV="dev"
            fi
          fi

          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_ENV

          if [ "$TARGET_ENV" = "prod" ]; then
            echo "EKS_CLUSTER=prod-ipark-eks" >> $GITHUB_ENV
            echo "IMAGE_TAG=prod-${{ github.sha }}" >> $GITHUB_ENV
            echo "AWS_ROLE_ARN=arn:aws:iam::833333701463:role/prod-ipark-github-actions-role" >> $GITHUB_ENV
            echo "REPLICAS=1" >> $GITHUB_ENV
          else
            echo "EKS_CLUSTER=dev-ipark-eks" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev-${{ github.sha }}" >> $GITHUB_ENV
            echo "AWS_ROLE_ARN=arn:aws:iam::833333701463:role/dev-ipark-github-actions-role" >> $GITHUB_ENV
            echo "REPLICAS=1" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ipark-app
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.TARGET_ENV }}-latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.TARGET_ENV }}-latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region eu-central-1 --name ${{ env.EKS_CLUSTER }}

      - name: Deploy Manifests to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ipark-app
          AWS_REGION: eu-central-1
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_API_PUBLIC_KEY: ${{ secrets.STRIPE_API_PUBLIC_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          kubectl create secret generic ipark-secrets \
            --from-literal=STRIPE_API_KEY="$STRIPE_API_KEY" \
            --from-literal=STRIPE_API_PUBLIC_KEY="$STRIPE_API_PUBLIC_KEY" \
            --from-literal=STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          sed -i "s|REPLICAS_PLACEHOLDER|$REPLICAS|g" k8s/deployment.yaml
          sed -i "s|ENVIRONMENT_PLACEHOLDER|$TARGET_ENV|g" k8s/configmap.yaml
          sed -i "s|IMAGE_PLACEHOLDER|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s/deployment.yaml
          
          kubectl delete pods --field-selector status.phase=Failed --ignore-not-found=true
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/deployment.yaml
          
          if ! kubectl rollout status deployment/ipark-deployment --timeout=150s; then
            echo "=== PODS STATUS ==="
            kubectl get pods -o wide
            echo "=== PODS EVENTS / ERRORS ==="
            kubectl describe pods -l app=ipark-backend
            echo "=== APPLICATION LOGS ==="
            kubectl logs -l app=ipark-backend --tail=150 --all-containers=true
            exit 1
          fi
          
          kubectl get svc ipark-service