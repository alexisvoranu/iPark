name: iPark ECS CI/CD Pipeline

on:
  push:
    branches: [ "develop", "master" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose deploy environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Artifact with Maven
        run: mvn clean package -DskipTests

      - name: Set Environment Variables
        id: env-setup
        run: |
          TARGET_ENV="${{ github.event.inputs.environment }}"
          if [ -z "$TARGET_ENV" ]; then
            if [ "${{ github.ref_name }}" = "main" ]; then
              TARGET_ENV="prod"
            else
              TARGET_ENV="dev"
            fi
          fi

          if [ "$TARGET_ENV" = "prod" ]; then
            echo "ECS_CLUSTER=prod-ipark-cluster" >> $GITHUB_ENV
            echo "ECS_SERVICE=prod-ipark-service" >> $GITHUB_ENV
            echo "IMAGE_TAG=prod-latest" >> $GITHUB_ENV
          else
            echo "ECS_CLUSTER=dev-ipark-cluster" >> $GITHUB_ENV
            echo "ECS_SERVICE=dev-ipark-service" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev-latest" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::833333701463:role/ipark-github-actions-role
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ipark-app
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Amazon ECS Fargate
        env:
          AWS_REGION: eu-central-1
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --force-new-deployment